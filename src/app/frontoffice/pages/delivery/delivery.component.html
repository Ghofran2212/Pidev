<div class="delivery-page py-5 bg-light min-vh-100">
    <div class="container">
        <div class="card border-0 shadow-sm rounded-lg p-5">
            <div class="text-center mb-5">
                <div class="mb-4">
                    <div
                        class="status-badge bg-success-light text-success d-inline-block px-4 py-2 rounded-pill font-weight-bold">
                        <i class="fas fa-truck mr-2"></i> {{status}}
                    </div>
                </div>
                <h2 class="font-weight-bold mb-1">Track Your Order</h2>
                <p class="text-muted">Order ID: <span class="text-dark font-weight-bold">#{{orderId}}</span></p>
            </div>

            <!-- Timeline -->
            <div class="delivery-timeline mb-5">
                <div class="timeline-track"></div>
                <div class="timeline-steps">
                    <div class="step" [class.active]="step >= 1">
                        <div class="step-icon"><i class="fas fa-check"></i></div>
                        <div class="step-label">Ordered</div>
                        <div class="step-date small text-muted">Oct 20</div>
                    </div>
                    <div class="step" [class.active]="step >= 2">
                        <div class="step-icon"><i class="fas fa-box"></i></div>
                        <div class="step-label">Processing</div>
                        <div class="step-date small text-muted">Oct 21</div>
                    </div>
                    <div class="step" [class.active]="step >= 3">
                        <div class="step-icon"><i class="fas fa-shipping-fast"></i></div>
                        <div class="step-label">In Transit</div>
                        <div class="step-date small text-muted">Oct 22</div>
                    </div>
                    <div class="step" [class.active]="step >= 4">
                        <div class="step-icon"><i class="fas fa-home"></i></div>
                        <div class="step-label">Delivered</div>
                        <div class="step-date small text-muted">Expected Oct 23</div>
                    </div>
                </div>
            </div>

            <div class="row pt-4 border-top">
                <div class="col-md-6 mb-4 mb-md-0">
                    <h5 class="font-weight-bold mb-3">Shipping Address</h5>
                    <p class="text-muted mb-0">
                        John Doe<br>
                        123 Pinecrest Avenue<br>
                        Mountain View, CA 94043
                    </p>
                </div>
                <div class="col-md-6">
                    <h5 class="font-weight-bold mb-3">Delivery Personnel</h5>
                    <div class="d-flex align-items-center">
                        <div class="bg-light rounded-circle p-3 mr-3">
                            <i class="fas fa-user-tie fa-2x text-muted"></i>
                        </div>
                        <div>
                            <p class="mb-0 font-weight-bold">Robert Miller</p>
                            <p class="mb-0 text-muted small">ID: #DP-98234</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-5">
                <button class="btn btn-outline-success rounded-pill px-5" routerLink="/shop">
                    Continue Shopping
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .rounded-lg {
        border-radius: 20px;
    }

    .bg-success-light {
        background-color: rgba(40, 167, 69, 0.1);
    }

    .delivery-timeline {
        position: relative;
        padding: 40px 0;
    }

    .timeline-track {
        position: absolute;
        top: 60px;
        left: 5%;
        right: 5%;
        height: 4px;
        background: #e9ecef;
        z-index: 1;
    }

    .timeline-steps {
        position: relative;
        display: flex;
        justify-content: space-between;
        z-index: 2;
    }

    .step {
        text-align: center;
        width: 25%;
    }

    .step-icon {
        width: 40px;
        height: 40px;
        background: #fff;
        border: 4px solid #e9ecef;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        color: #adb5bd;
        transition: all 0.3s ease;
    }

    .step-label {
        font-weight: bold;
        color: #adb5bd;
        margin-bottom: 5px;
    }

    .step.active .step-icon {
        background: #28a745;
        border-color: #28a745;
        color: #fff;
        box-shadow: 0 0 15px rgba(40, 167, 69, 0.3);
    }

    .step.active .step-label {
        color: #28a745;
    }
</style>
