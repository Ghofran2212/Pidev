<div class="login-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-lg-5 col-md-7">
        
        <!-- Login Card -->
        <div class="login-card">
          
          <!-- Logo Section -->
          <div class="text-center mb-4">
            <div class="login-logo mb-3">
              <i class="fas fa-campground"></i>
            </div>
            <h2 class="font-weight-bold mb-2">Welcome Back!</h2>
            <p class="text-muted">Login to continue your adventure</p>
          </div>

          <!-- Login Form -->
          <form>
            
            <!-- Email Input -->
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                  </span>
                </div>
                <input type="email" class="form-control" placeholder="Enter your email">
              </div>
            </div>

            <!-- Password Input -->
            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                  </span>
                </div>
                <input type="password" class="form-control" placeholder="Enter your password">
              </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="rememberMe">
                <label class="custom-control-label" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="text-success small">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn btn-success btn-block btn-lg mb-3">
              Login
            </button>

            <!-- Divider -->
            <div class="divider">
              <span>OR</span>
            </div>

            <!-- Social Login Buttons -->
            <div class="row mb-3">
              <div class="col-6">
                <button type="button" class="btn btn-outline-primary btn-block">
                  <i class="fab fa-google mr-2"></i>Google
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-dark btn-block">
                  <i class="fab fa-facebook mr-2"></i>Facebook
                </button>
              </div>
            </div>

            <!-- Sign Up Link -->
            <div class="text-center mt-4">
              <p class="mb-0">
                Don't have an account? 
                <a href="#" class="text-success font-weight-bold">Sign Up</a>
              </p>
            </div>

          </form>

        </div>

      </div>
    </div>
  </div>
</div>
