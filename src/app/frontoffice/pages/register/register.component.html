<div class="register-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-lg-6 col-md-8">

        <div class="register-card">

          <div class="text-center mb-4">
            <div class="register-logo mb-3">
              <i class="fas fa-campground"></i>
            </div>
            <h2 class="font-weight-bold mb-2">Join CampWay</h2>
            <p class="text-muted">Create your account and start exploring</p>
          </div>

          <form (ngSubmit)="onSubmit()">

            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">First Name</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <i class="fas fa-user"></i>
                      </span>
                    </div>
                    <input type="text" class="form-control" name="firstName" [(ngModel)]="userData.firstName"
                      placeholder="John" required>
                  </div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">Last Name</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <i class="fas fa-user"></i>
                      </span>
                    </div>
                    <input type="text" class="form-control" name="lastName" [(ngModel)]="userData.lastName"
                      placeholder="Doe" required>
                  </div>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-envelope"></i>
                  </span>
                </div>
                <input type="email" class="form-control" name="email" [(ngModel)]="userData.email"
                  placeholder="your.email@example.com" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-phone"></i>
                  </span>
                </div>
                <input type="tel" class="form-control" name="phoneNumber" [(ngModel)]="userData.phoneNumber"
                  placeholder="+1 (555) 123-4567">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                  </span>
                </div>
                <input type="password" class="form-control" name="password" [(ngModel)]="userData.password"
                  placeholder="Create a strong password" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-lock"></i>
                  </span>
                </div>
                <input type="password" class="form-control" name="confirmPassword"
                  [(ngModel)]="userData.confirmPassword" placeholder="Confirm your password" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">I am a...</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">
                    <i class="fas fa-users-cog"></i>
                  </span>
                </div>
                <select class="form-control" name="role" [(ngModel)]="userData.role" required>
                  <option *ngFor="let role of roles" [value]="role.value">{{role.label}}</option>
                </select>
              </div>
            </div>

            <div class="custom-control custom-checkbox mb-4">
              <input type="checkbox" class="custom-control-input" id="terms" required>
              <label class="custom-control-label" for="terms">
                I agree to the <a href="javascript:void(0)" class="text-success hover-underline">Terms & Conditions</a>
              </label>
            </div>

            <button type="submit" class="btn btn-success btn-block btn-lg mb-3">
              Create Account
            </button>

            <div class="divider">
              <span>OR</span>
            </div>

            <div class="row mb-3">
              <div class="col-6">
                <button type="button" class="btn btn-outline-primary btn-block">
                  <i class="fab fa-google mr-2"></i>Google
                </button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-outline-dark btn-block">
                  <i class="fab fa-facebook mr-2"></i>Facebook
                </button>
              </div>
            </div>

            <div class="text-center mt-4">
              <p class="mb-0">
                Already have an account?
                <a routerLink="/login" class="text-success font-weight-bold">Login</a>
              </p>
            </div>

          </form>

        </div>

      </div>
    </div>
  </div>
</div>
