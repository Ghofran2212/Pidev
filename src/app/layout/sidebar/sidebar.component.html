<aside class="main-sidebar sidebar-dark-primary elevation-2"
  style="background: linear-gradient(180deg, #2d5016 0%, #1a3d0a 100%);">
  <!-- Brand Logo -->
  <a routerLink="/admin/dashboard" class="brand-link border-bottom" style="background-color: rgba(0,0,0,0.2);">
    <span class="brand-text font-weight-bold ml-2" style="color: #fff; font-size: 18px;">
      CampWay
    </span>
    <p class="text-white-50 small mb-0 ml-2" style="font-size: 11px;">Admin Panel</p>
  </a>

  <!-- Sidebar -->
  <div class="sidebar">

    <!-- Sidebar Menu -->
    <nav class="mt-3">
      <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">

        <li class="nav-header text-white-50">MENU</li>

        <li class="nav-item" *ngFor="let item of filteredMenuItems">
          <a [routerLink]="item.link" routerLinkActive="active" class="nav-link nav-link-custom">
            <i class="nav-icon fas {{item.icon}}"></i>
            <p>{{item.title}}</p>
          </a>
        </li>

        <li class="nav-header text-white-50 mt-3">SYSTEM</li>
        <li class="nav-item">
          <a href="#" class="nav-link nav-link-custom">
            <i class="nav-icon fas fa-cog"></i>
            <p>Settings</p>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Settings -->
